{% extends 'base.html' %}
{% block main %}
<main class="main">
    <section class="products-section">
        <h2 class="visually-hidden">Список товаров</h2>
        <div id="productsGrid" class="products-grid" aria-live="polite">
            {% for tovar in tovars %}
            <article class="product-card">
                <img class="product-image" alt="{{ tovar.title }}"
                     src="{{ tovar.img.url }}">
                <div class="product-info">
                    <h3 class="product-title">{{ tovar.title }}</h3>
                    <p class="product-price">{{ tovar.price }}</p>
                    <div class="product-actions">
                        <button class="add-cart">Добавить в корзину</button>
                        <a href="{% url 'product' tovar.id %}" class="view-btn">Подробнее</a>
                    </div>
                </div>
            </article>
            {% endfor %}
        </div>
    </section>
</main>
{% endblock main %}
