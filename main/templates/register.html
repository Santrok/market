{% extends 'base.html' %}
{% block main %}
<div class="auth-container">
  <h2 class="auth-title">Регистрация</h2>
  <form action="" method="POST" class="auth-form">
      {% csrf_token %}
      <table>
          {{ form.as_table }}
      </table>
      <button type="submit" class="auth-btn">Зарегистрироваться</button>
  </form>
</div>
{% endblock main %}
